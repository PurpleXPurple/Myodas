<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg-base: #0a0a0a; --bg-card: #141414; --bg-hover: #1f1f1f;
        --border: #2a2a2a; --text-main: #ffffff; --text-mut: #888888;
        --accent: #4d7cfe; --danger: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { width: 380px; height: 580px; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; overflow: hidden; }
      
      header { padding: 16px 16px 0; background: var(--bg-card); border-bottom: 1px solid var(--border); }
      .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .badge { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
      
      .tabs { display: flex; gap: 8px; }
      .tab { background: transparent; border: none; color: var(--text-mut); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 6px 6px 0 0; cursor: pointer; transition: 0.2s; position: relative; }
      .tab:hover { color: var(--text-main); background: var(--bg-hover); }
      .tab.active { color: var(--accent); }
      .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); }
      
      main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
      .view.active { display: flex; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      
      .editor { padding: 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); display: flex; flex-direction: column; gap: 8px; }
      input, textarea, select { width: 100%; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; border-radius: 6px; font-size: 13px; transition: border 0.2s; }
      input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
      textarea { min-height: 80px; max-height: 150px; resize: vertical; font-family: inherit; line-height: 1.4; }
      
      button.primary { background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
      button.primary:hover:not(:disabled) { background: #3b6ae0; }
      button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
      
      .list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: 0.2s; animation: slideUp 0.2s ease-out; }
      .item:hover { border-color: #444; transform: translateY(-1px); }
      .item-content { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: flex-start; }
      .item-icon { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--bg-base); border-radius: 4px; color: var(--accent); flex-shrink: 0; }
      .item-icon svg { width: 14px; height: 14px; }
      .item-text { flex: 1; min-width: 0; }
      .item-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item-desc { font-size: 11px; color: var(--text-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
      .item-del { background: transparent; border: 1px solid transparent; color: var(--text-mut); padding: 4px; border-radius: 4px; cursor: pointer; flex-shrink: 0; transition: 0.2s; display: flex; }
      .item-del:hover { background: rgba(239,68,68,0.1); color: var(--danger); border-color: rgba(239,68,68,0.2); }
      
      .fetch-container { padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
      .fetch-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .fetch-row { display: flex; gap: 8px; }
      
      .icon-picker-row { display: flex; gap: 8px; align-items: center; }
      .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); cursor: pointer; flex-shrink: 0; transition: 0.2s; }
      .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
      
      #icon-picker-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease-out; }
      .icon-picker-modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      .icon-picker-header { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
      .icon-picker-header span { font-weight: 600; font-size: 14px; }
      .icon-picker-header button { background: none; border: none; color: var(--text-mut); cursor: pointer; font-size: 16px; }
      #icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
      .icon-grid-item { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-mut); transition: 0.15s; border: 1px solid transparent; }
      .icon-grid-item:hover { background: var(--bg-hover); color: var(--text-main); transform: scale(1.1); }
      .icon-grid-item.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
      .icon-grid-item svg { width: 18px; height: 18px; }
      
      .dsnx-switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
      .dsnx-switch input { opacity: 0; width: 0; height: 0; }
      .dsnx-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .3s; border-radius: 20px; }
      .dsnx-slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
      .dsnx-switch input:checked + .dsnx-slider { background-color: var(--accent); }
      .dsnx-switch input:checked + .dsnx-slider:before { transform: translateX(14px); }

      .theme-card { display: flex; justify-content: space-between; background: var(--bg-card); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); align-items: center; }
      .theme-card input[type="color"] { width: 32px; height: 32px; padding: 0; border: none; background: transparent; cursor: pointer; border-radius: 4px; }
      .theme-card input[type="text"] { flex: 1; margin-left: 12px; border: 1px solid var(--border); background: var(--bg-base); color: var(--text-main); padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner { animation: spin 1s linear infinite; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent)" stroke-width="2"><polygon points="12 2 22 7 22 17 12 22 2 17 2 7 12 2"/><path d="M8 15V9l8 6V9"/></svg>
          Prompt Nexus
        </h1>
        <span class="badge">v11.2</span>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="prompts">Prompts</button>
        <button class="tab" data-tab="skills">Skills</button>
        <button class="tab" data-tab="fetch">Fetch</button>
        <button class="tab" data-tab="tokens">Tokens</button>
        <button class="tab" data-tab="theme">Theme</button>
      </div>
    </header>
    
    <main>
      <div id="prompts-view" class="view active">
        <div class="editor">
          <input id="prompt-title" type="text" placeholder="Prompt Name" />
          <textarea id="prompt-content" placeholder="Prompt text..."></textarea>
          <button id="save-prompt-btn" class="primary">Save Prompt</button>
        </div>
        <div class="list" id="prompts-list"></div>
      </div>

      <div id="skills-view" class="view">
        <div class="editor">
          <div class="icon-picker-row">
            <button id="icon-picker-trigger" class="icon-btn" type="button" title="Choose icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" id="selected-icon-preview"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            </button>
            <input id="skill-title" type="text" placeholder="Skill Name (e.g., Meow)" />
          </div>
          <input id="skill-description" type="text" placeholder="Short description" />
          <textarea id="skill-content" placeholder="Skill text to inject..."></textarea>
          <button id="save-skill-btn" class="primary">Save Skill</button>
        </div>
        <div class="list" id="skills-list"></div>
      </div>

      <div id="fetch-view" class="view">
        <div class="fetch-container">
          <div class="fetch-card">
            <label style="font-size:12px; font-weight:600; color:var(--text-mut);">GitHub Repository</label>
            <div class="fetch-row">
              <input id="gh-url" type="text" placeholder="https://github.com/owner/repo" />
              <button id="gh-btn" class="primary">Fetch</button>
            </div>
          </div>
          <div class="fetch-card">
            <label style="font-size:12px; font-weight:600; color:var(--text-mut);">Hugging Face</label>
            <div class="fetch-row">
              <input id="hf-id" type="text" placeholder="meta-llama/Llama-2-7b" />
              <button id="hf-btn" class="primary">Fetch</button>
            </div>
            <div class="fetch-row" style="margin-top: 8px;">
              <input id="hf-token" type="password" placeholder="Optional: HF Token" />
            </div>
          </div>
        </div>
      </div>

      <div id="tokens-view" class="view">
        <div class="fetch-container">
          <div class="fetch-card" style="background:rgba(77,124,254,0.05); border-color:var(--accent);">
            <label style="color:var(--accent); font-size:12px; font-weight:600;">Global Usage (All Chats)</label>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:8px;">
              <span>Total Tokens:</span>
              <strong id="dsnx-global-tokens" style="color:var(--accent);">0</strong>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:4px;">
              <span>Chats Tracked:</span>
              <span id="dsnx-global-chats">0</span>
            </div>
          </div>
          <div class="fetch-card">
            <label style="font-size:12px; font-weight:600; color:var(--text-mut);">Current Chat</label>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:8px;">
              <span>Messages:</span>
              <span id="dsnx-chat-msgs">0</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:4px;">
              <span>Tokens Used:</span>
              <strong id="dsnx-chat-tokens" style="color:var(--accent);">0</strong>
            </div>
            <div style="margin-top:12px;">
              <div style="font-size:11px; color:var(--text-mut); margin-bottom:4px;">Context Window Usage (128k limit)</div>
              <div style="height:6px; background:var(--border); border-radius:3px; overflow:hidden;">
                <div id="dsnx-context-bar" style="height:100%; background:var(--accent); width:0%; transition:width 0.3s;"></div>
              </div>
            </div>
            <button id="dsnx-refresh-tokens" class="primary" style="width:100%; margin-top:12px; background:var(--bg-hover); color:var(--text-main); border:1px solid var(--border);">Refresh Count</button>
          </div>
        </div>
      </div>

      <div id="theme-view" class="view">
        <div class="editor" style="flex:1; border-bottom:none; overflow-y:auto;">
          <label class="fetch-card" style="cursor:pointer; align-items:center; justify-content:center; text-align:center; border: 2px dashed var(--border);">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--text-mut)" stroke-width="2" style="margin-bottom:8px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <div style="font-size:13px; font-weight:600;">Upload Image</div>
            <input type="file" id="theme-image-input" accept="image/*" style="display:none;" />
          </label>

          <div style="margin-top: 16px; display:flex; flex-direction:column; gap:12px;">
            <div class="theme-card"><span>Accent</span><input type="color" id="color-accent" value="#4d7cfe"><input type="text" id="text-accent" value="#4d7cfe"></div>
            <div class="theme-card"><span>Background</span><input type="color" id="color-bg" value="#0a0a0a"><input type="text" id="text-bg" value="#0a0a0a"></div>
            <div class="theme-card"><span>Surface</span><input type="color" id="color-surface" value="#141414"><input type="text" id="text-surface" value="#141414"></div>
            <div class="theme-card"><span>Text</span><input type="color" id="color-text" value="#ffffff"><input type="text" id="text-text" value="#ffffff"></div>
          </div>

          <div style="display:flex; gap:8px; margin-top:20px;">
            <button id="apply-theme-btn" class="primary" style="flex:1;">Apply Theme</button>
            <button id="reset-theme-btn" class="primary" style="flex:1; background:var(--bg-card); color:var(--text-main); border:1px solid var(--border);">Reset</button>
          </div>
        </div>
      </div>
    </main>

    <div id="icon-picker-overlay">
      <div class="icon-picker-modal">
        <div class="icon-picker-header">
          <span>Choose an icon</span>
          <button id="icon-picker-close">✕</button>
        </div>
        <div id="icon-grid"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
